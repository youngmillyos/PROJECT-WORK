<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | SkillCampus</title>
    <script src="https://kit.fontawesome.com/fe148a6a2e.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS Project/login.css">
    <link rel="stylesheet" href="CSS Project/footer.css">
    <link rel="stylesheet" href="CSS Project/responsive.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="image/works.png" alt="Logo">
        </div>

        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="job.html">Jobs</a>
            <a href="skills.html">Skills</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-buttons">
            <a href="skills.html" class="login-btn">Login</a>
            <a href="signup.html" class="signup-btn">Sign Up</a>
        </div>
    </header>
    <form action="skills.html" method="get" class="login-form">
        <div class="input-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Email" required>
        </div>

        <div class="input-group password-box">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Password" required>
        </div>

        <button type="submit">Log in</button>
    </form>
    <footer class="site-footer">
        <div class="site-footer-content">
            <div class="site-footer-brand"><i class="fa-solid fa-graduation-cap" aria-hidden="true" style="color: blueviolet;"></i> Online Job Recruitment Portal</div>
            <p>&copy; 2026 Online Job Recruitment Portal. Built for ambitious students and thoughtful employers.</p>
            <div class="site-footer-socials">
                <a href="#" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp" aria-hidden="true" color="#25D366"></i></a>
                <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook" aria-hidden="true" color="blue"></i></a>
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram" aria-hidden="true" color="purple"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
