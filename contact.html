<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <script src="https://kit.fontawesome.com/fe148a6a2e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="CSS Project/homepage.css">
    <link rel="stylesheet" href="CSS Project/contact.css">
    <link rel="stylesheet" href="CSS Project/footer.css">
    <link rel="stylesheet" href="CSS Project/responsive.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="../image2/works.png" alt="Logo">
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="job.html">Jobs</a>
            <a href="skills.html">Skills</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="signup.html" class="signup-btn">Sign Up</a>
        </div>
    </header>

    <main class="contact-container">
        <div class="contact-card">
            <h1 class="contact-us-text">Contact Us</h1>
            <p class="contact-intro">Have a question? Contact us and we will get back to you soon.</p>

            <form class="contact-form">
                <div class="input-group">
                    <label for="full-name">Full Name</label>
                    <input id="full-name" type="text" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="subject">Subject</label>
                    <input id="subject" type="text" placeholder="What do you need help with?">
                </div>

                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <a href="homepage.html" class="back-link">Back to Home</a>
        </div>
    </main>
    <footer class="site-footer">
        <div class="site-footer-content">
            <div class="site-footer-brand"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i> Online Job Recruitment Portal</div>
            <p>&copy; 2026 Online Job Recruitment Portal. Built for ambitious students and thoughtful employers.</p>
            <div class="site-footer-socials">
                <a href="#" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp" aria-hidden="true" color="#25D366"></i></a>
                <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook" aria-hidden="true" color="blue"></i></a>
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram" aria-hidden="true" color="purple"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
